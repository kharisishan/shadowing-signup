<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Shadow Sessions Admin</title>
<style>
:root{box-sizing:border-box;--bg:#f6f5f1;--card:#fff;--ink:#1c1b19;--mute:#6b6a65;--line:#e3e1da;--acc:#1f5eff;--accbg:#e8efff;--bad:#c0392b;--ok:#157a4b;--warn:#b26a00}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#f1efe8;--mute:#a09e96;--line:#33322f;--acc:#6b95ff;--accbg:#1d2740;--bad:#ff7b6b;--ok:#5fd39a;--warn:#f0b35a}}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.4rem;margin:0 0 12px}
h2{font-size:1.02rem;margin:20px 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--mute);font-size:.85rem}
h2 small.warn{color:var(--warn)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
input,button,select{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input{flex:1;min-width:150px}
select{flex:1;min-width:130px}
button{cursor:pointer;background:var(--acc);color:#fff;border-color:var(--acc)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.sm{padding:5px 10px;font-size:.9rem}
button.rel{background:transparent;color:var(--bad);border-color:var(--bad)}
button.add{background:transparent;color:var(--acc);border-color:var(--acc)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{background:transparent;color:var(--ink);border-color:var(--line)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:999px;font-size:.88rem;cursor:pointer}
.chip.on{background:var(--accbg);border-color:var(--acc)}
.chip b{font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.row small{color:var(--mute);display:block}
.row .btns{display:flex;gap:6px;flex-shrink:0}
.open{color:var(--mute)}
.who{font-weight:600;color:var(--ok)}
.feed .row{align-items:flex-start}
.feed .t{color:var(--mute);font-size:.85rem;white-space:nowrap}
.feed .what b{font-weight:600}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mute);margin-left:6px}
.note{color:var(--mute);padding:14px;text-align:center}
.count{color:var(--mute);font-size:.9rem;margin:4px 0 6px}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#msg.on{opacity:1}
[hidden]{display:none!important}

/* ---- dashboard (morethancables look: charcoal, white titles, teal-green accent) ---- */
.dash{
  /* BRAND COLOURS: change these to match the official palette */
  --d-bg:#12171a;--d-card:#1a2124;--d-line:#2a3336;--d-ink:#f3f6f5;--d-mute:#9aa8aa;
  --d-acc:#34d3b1;--d-track:#243133;--d-warn:#e6b04a;
  background:var(--d-bg);color:var(--d-ink);border-radius:16px;padding:18px;border:1px solid var(--d-line)}
.dash *{min-width:0}
.d-brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 14px;color:var(--d-mute);font-size:.85rem}
.d-brand b{color:var(--d-ink);font-size:1rem;letter-spacing:.01em}
.d-brand b i{font-style:normal;color:var(--d-acc)}
.d-top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px;margin-bottom:10px}
@media (max-width:620px){.d-top{grid-template-columns:1fr}}
.d-card{background:var(--d-card);border:1px solid var(--d-line);border-radius:14px;padding:14px;margin-bottom:10px}
.d-top .d-card{margin-bottom:0}
.d-card h3{font-size:.78rem;letter-spacing:.07em;text-transform:lowercase;color:var(--d-mute);font-weight:600;margin:0 0 10px}
.d-hero{font-size:3.6rem;line-height:1;font-weight:700;letter-spacing:-.02em;color:var(--d-ink)}
.d-hero small{font-size:1.05rem;font-weight:500;color:var(--d-mute);letter-spacing:0;margin-left:8px}
.d-meter{height:10px;border-radius:999px;background:var(--d-track);margin-top:14px;overflow:hidden}
.d-meter>i{display:block;height:100%;background:var(--d-acc);border-radius:999px}
.d-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.d-tile{background:var(--d-card);border:1px solid var(--d-line);border-radius:14px;padding:12px 14px}
.d-tile .l{color:var(--d-mute);font-size:.8rem}
.d-tile .v{font-size:1.7rem;font-weight:650;line-height:1.15;margin-top:2px}
.d-tile .v.sm{font-size:1.05rem;line-height:1.3;margin-top:6px}
.d-tile .s{color:var(--d-mute);font-size:.8rem;margin-top:2px}
.d-tile.warn{border-color:var(--d-warn)}
.d-tile.warn .l{color:var(--d-warn)}
.d-bars{display:grid;gap:10px}
.d-bar{display:grid;grid-template-columns:minmax(78px,118px) minmax(0,1fr) auto;gap:10px;align-items:center;cursor:default;border-radius:8px;outline-offset:3px}
.d-bar:hover,.d-bar:focus-visible{outline:1px solid var(--d-line)}
.d-bar .n{font-size:.9rem;overflow-wrap:anywhere}
.d-bar .t{height:14px;border-radius:4px;background:var(--d-track);position:relative}
.d-bar .t>i{position:absolute;left:0;top:0;bottom:0;background:var(--d-acc);border-radius:0 4px 4px 0;min-width:0}
.d-bar .t>i.zero{display:none}
.d-bar .v{font-size:.85rem;color:var(--d-ink);white-space:nowrap;min-width:78px;text-align:right}
.d-bar .v span{color:var(--d-mute)}
.d-heat{display:grid;gap:2px}
.d-heat .h{color:var(--d-mute);font-size:.75rem;text-align:center;padding:2px 0 6px;white-space:nowrap}
.d-heat .r{color:var(--d-ink);font-size:.85rem;display:flex;align-items:center;padding-right:8px}
button.d-cell{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;height:44px;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer}
button.d-cell:hover,button.d-cell:focus-visible{outline:2px solid var(--d-ink);outline-offset:-2px}
.d-cell.none{display:flex;align-items:center;justify-content:center;height:44px;border-radius:8px;background:transparent;border:1px dashed var(--d-line);color:var(--d-mute);cursor:default;font-weight:400;font-size:.88rem}
.d-legend{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--d-mute);font-size:.78rem}
.d-legend i{display:block;width:120px;height:8px;border-radius:999px}
.d-cols{display:flex;gap:2px;align-items:flex-end;height:120px;padding-top:18px}
.d-col{flex:1 1 0;max-width:24px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;position:relative;cursor:default;border-radius:6px;outline-offset:2px}
.d-col:hover,.d-col:focus-visible{outline:1px solid var(--d-line)}
.d-col .b{width:100%;background:var(--d-acc);border-radius:4px 4px 0 0;min-height:2px}
.d-col .b.z{background:var(--d-track)}
.d-col .x{font-size:.68rem;color:var(--d-mute);line-height:1}
.d-col .top{position:absolute;top:-16px;font-size:.75rem;color:var(--d-ink);font-weight:600}
.d-note{color:var(--d-mute);font-size:.9rem}
.d-table summary{cursor:pointer;color:var(--d-mute);font-size:.85rem}
.d-table table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.85rem}
.d-table th,.d-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--d-line)}
.d-table th{color:var(--d-mute);font-weight:600}
.d-table td.num,.d-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.d-rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
button.d-ring{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;text-align:center}
button.d-ring:hover,button.d-ring:focus-visible{border-color:var(--d-line);background:rgba(255,255,255,.03)}
button.d-ring.on{border-color:var(--d-acc)}
.d-ring svg{width:104px;height:104px;display:block}
.d-ring .rt{stroke:var(--d-track)}
.d-ring .rf{stroke:var(--d-acc)}
.d-ring .rp{fill:var(--d-ink);font-size:22px;font-weight:700;font-family:inherit}
.d-ring .rn{font-size:.95rem;font-weight:650;margin-top:4px}
.d-ring .rs{font-size:.8rem;color:var(--d-mute)}
.d-score{display:grid;gap:6px}
.d-srow{display:grid;grid-template-columns:34px minmax(80px,170px) minmax(0,1fr) 44px;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid transparent;outline-offset:2px}
.d-srow:hover,.d-srow:focus-visible{border-color:var(--d-line)}
.d-srow.top{background:rgba(52,211,177,.08)}
.d-rank{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:var(--d-mute);border:1px solid var(--d-line)}
.d-srow.top .d-rank{background:var(--d-acc);color:#04100e;border-color:var(--d-acc)}
.d-sname{font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-srow.top .d-sname{font-weight:650}
.d-sbar{height:10px;border-radius:4px;background:var(--d-track)}
.d-sbar>i{display:block;height:100%;background:var(--d-acc);border-radius:0 4px 4px 0}
.d-snum{text-align:right;font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.d-snum small{display:block;font-size:.65rem;font-weight:400;color:var(--d-mute);margin-top:2px}
.d-more{all:unset;cursor:pointer;color:var(--d-acc);font-size:.88rem;margin-top:10px;display:inline-block;border-radius:6px;outline-offset:3px}
.d-more:focus-visible{outline:2px solid var(--d-acc)}
@media (max-width:480px){.d-srow{grid-template-columns:30px minmax(0,1fr) 40px}.d-sbar{display:none}}
.d-foot{text-align:center;color:var(--d-mute);font-size:.78rem;margin-top:14px}
#tip{position:fixed;z-index:20;background:#0c1011;color:#f3f6f5;border:1px solid #2a3336;border-radius:10px;padding:8px 10px;font-size:.82rem;pointer-events:none;max-width:240px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#tip .tv{font-weight:650;font-size:.95rem}
#tip .ts{color:#9aa8aa}
</style>
</head>
<body>
<main>
  <h1>Shadow Sessions Admin</h1>

  <div class="bar">
    <input id="key" type="password" placeholder="Admin key" autocomplete="off">
    <button id="unlock" type="button">Unlock</button>
    <span id="lockstate" class="count"></span>
  </div>

  <div class="tabs">
    <button id="tabSlots" class="on" type="button">Slots</button>
    <button id="tabDash" type="button">Dashboard</button>
    <button id="tabFeed" type="button">Activity</button>
  </div>

  <div class="bar">
    <select id="fc" aria-label="Campus"></select>
    <select id="fd" aria-label="Date"></select>
    <select id="fs" aria-label="Status"><option value="">All slots</option><option value="open">Open only</option><option value="taken">Taken only</option></select>
    <input id="fq" type="search" placeholder="Search a name">
  </div>

  <div id="slotsView">
    <div class="chips" id="sum"></div>
    <div class="bar">
      <button class="ghost" id="copy" type="button">Copy list</button>
      <button class="ghost" id="csv" type="button">Export CSV</button>
      <button class="ghost" id="reload" type="button">Refresh</button>
      <button class="rel" id="relall" type="button" hidden></button>
    </div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </div>

  <div id="dashView" hidden><div class="dash" id="dash"></div></div>

  <div id="feedView" hidden>
    <div class="count" id="feedcount"></div>
    <div class="feed" id="feed"></div>
  </div>
</main>
<div id="msg" role="status"></div>
<div id="tip" role="tooltip" hidden></div>
<script>
const FOUR=["Mac 1 Graphics & Slides","Mac 2 Lyrics & Sermon","Lights","Internal Livestream & Translations"];
const mk=(names,times)=>names.map(n=>({n,t:times}));
const day=(d,roles)=>({d,roles});
// Putra/PJ: all four roles at 9 AM and 11 AM
const std=d=>day(d,mk(FOUR,["9 AM","11 AM"]));
const GROUPS=[
 {title:"Subang",days:["1st November","15th November"].map(d=>day(d,mk(["Lyrics","Sermon","Lyrics (Side Screens)","Lights"],["5 PM"])))},
 {title:"Mandarin",days:["1st November","8th November","15th November"].map(d=>day(d,mk(["Lyrics","Sermon","Lights"],["2 PM"])))},
 {title:"Putra",days:["1st November","8th November","15th November","22nd November"].map(std)},
 {title:"PJ",days:["1st November","8th November","22nd November"].map(std)}
];
const sid=(d,g,r,t)=>[d.replace(/\s*\(.*\)\s*$/,""),g,r,t].join("-").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/-$/,"");
const $=id=>document.getElementById(id);

// Flat list of every slot, plus a lookup by id (used to label the activity feed)
const SLOTS=[],IDX={};
GROUPS.forEach(g=>g.days.forEach(dy=>dy.roles.forEach(r=>r.t.forEach(t=>{
  const s={id:sid(dy.d,g.title,r.n,t),campus:g.title,date:dy.d,role:r.n,time:t};SLOTS.push(s);IDX[s.id]=s;
}))));
const dayNum=d=>parseInt(d,10)||0;
const slotText=s=>s.role+(s.time?" ("+s.time+")":"");

let claims={},feed=[],keyOk=false,tab="slots",sbAll=false;
const F={campus:"",date:"",status:"",q:""};

function toast(t){const m=$("msg");m.textContent=t;m.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>m.classList.remove("on"),2800)}
function el(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}

// ---------- server calls ----------
async function loadSlots(){
  try{
    const r=await fetch("/api/slots",{headers:{"x-token":"admin"}});
    if(!r.ok)throw 0;
    claims=(await r.json()).claims||{};
  }catch(e){toast("Can't reach the server")}
  renderAll();
}
async function adm(action,extra){
  const k=$("key").value.trim();
  if(!k){toast("Enter the admin key first");$("key").focus();return null}
  try{
    const r=await fetch("/api/admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({adminKey:k,action},extra||{}))});
    let d={};try{d=await r.json()}catch(e){}
    if(r.status===403){keyOk=false;try{sessionStorage.removeItem("adminkey")}catch(e){}toast("Wrong admin key");renderAll();return null}
    return {status:r.status,data:d};
  }catch(e){toast("Can't reach the server");return null}
}
async function unlock(quiet){
  const res=await adm("activity");
  if(res&&res.status===200){
    keyOk=true;feed=res.data.log||[];
    try{sessionStorage.setItem("adminkey",$("key").value.trim())}catch(e){}
    if(!quiet)toast("Unlocked");
  }
  renderAll();
}
async function refreshFeed(){
  if(!keyOk)return;
  const res=await adm("activity");
  if(res&&res.status===200){feed=res.data.log||[];renderAll()}
}

// ---------- filters ----------
function match(s){
  if(F.campus&&s.campus!==F.campus)return false;
  if(F.date&&s.date!==F.date)return false;
  const c=claims[s.id];
  if(F.status==="open"&&c)return false;
  if(F.status==="taken"&&!c)return false;
  if(F.q&&!(c&&c.name.toLowerCase().includes(F.q.toLowerCase())))return false;
  return true;
}
function fillFilters(){
  const fc=$("fc"),fd=$("fd");
  fc.textContent="";
  const all=el("option","All campuses");all.value="";fc.appendChild(all);
  GROUPS.forEach(g=>{const o=el("option",g.title);o.value=g.title;fc.appendChild(o)});
  fc.value=F.campus;
  fillDates();
}
function fillDates(){
  const fd=$("fd");fd.textContent="";
  const all=el("option","All dates");all.value="";fd.appendChild(all);
  const dates=[...new Set(SLOTS.filter(s=>!F.campus||s.campus===F.campus).map(s=>s.date))].sort((a,b)=>dayNum(a)-dayNum(b));
  dates.forEach(d=>{const o=el("option",d);o.value=d;fd.appendChild(o)});
  if(!dates.includes(F.date))F.date="";
  fd.value=F.date;
}

// ---------- slots view ----------
function renderSlots(){
  // campus progress chips (respect the date filter); click one to filter by that campus
  const sum=$("sum");sum.textContent="";
  GROUPS.forEach(g=>{
    const ss=SLOTS.filter(s=>s.campus===g.title&&(!F.date||s.date===F.date));
    if(!ss.length)return;
    const t=ss.filter(s=>claims[s.id]).length;
    const c=el("button",null,"chip"+(F.campus===g.title?" on":""));c.type="button";
    c.append(g.title+" ",el("b",t+"/"+ss.length));
    c.onclick=()=>{F.campus=F.campus===g.title?"":g.title;fillFilters();renderAll()};
    sum.appendChild(c);
  });

  const root=$("list");root.textContent="";
  const groups=[];
  GROUPS.forEach(g=>g.days.forEach(dy=>{
    const all=SLOTS.filter(s=>s.campus===g.title&&s.date===dy.d);
    const shown=all.filter(match);
    if(shown.length)groups.push({g,dy,all,shown});
  }));
  groups.sort((a,b)=>dayNum(a.dy.d)-dayNum(b.dy.d)||GROUPS.indexOf(a.g)-GROUPS.indexOf(b.g));
  let n=0;
  groups.forEach(({g,dy,all,shown})=>{
    const taken=all.filter(s=>claims[s.id]).length;
    const h=el("h2",g.title+" · "+dy.d);
    h.appendChild(el("small",taken+" of "+all.length+" taken"));
    if(!taken)h.appendChild(el("small","no sign-ups yet","warn"));
    root.appendChild(h);
    shown.forEach(s=>{
      n++;
      const c=claims[s.id];
      const row=el("div",null,"row");
      const left=el("div");
      left.appendChild(el("div",slotText(s)));
      left.appendChild(el("small",c?c.name:"Open",c?"who":"open"));
      row.appendChild(left);
      const btns=el("div",null,"btns");
      if(c){
        const rn=el("button","Rename","ghost sm");rn.type="button";rn.onclick=()=>rename(s,c);
        const rl=el("button","Release","rel sm");rl.type="button";rl.onclick=()=>release(s,c);
        btns.append(rn,rl);
      }else{
        const bk=el("button","Book for someone","add sm");bk.type="button";bk.onclick=()=>book(s);
        btns.appendChild(bk);
      }
      row.appendChild(btns);root.appendChild(row);
    });
  });
  if(!n)root.appendChild(el("div","Nothing matches these filters.","note"));
  const total=SLOTS.length,taken=SLOTS.filter(s=>claims[s.id]).length;
  $("count").textContent="Showing "+n+" slots · "+taken+" of "+total+" taken overall";

  // "release everything on this date" appears once a date is chosen
  const ra=$("relall");
  if(F.date){ra.hidden=false;ra.textContent="Release all on "+F.date+(F.campus?" ("+F.campus+")":"")}
  else ra.hidden=true;
}

// ---------- activity view ----------
function whenText(iso){
  try{return new Date(iso).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return iso}
}
function renderFeed(){
  const root=$("feed");root.textContent="";
  if(!keyOk){$("feedcount").textContent="";root.appendChild(el("div","Enter the admin key and press Unlock to see activity.","note"));return}
  const rows=feed.filter(l=>{
    const s=IDX[l.slot];
    if(F.campus&&(!s||s.campus!==F.campus))return false;
    if(F.date&&(!s||s.date!==F.date))return false;
    if(F.q&&!(l.name||"").toLowerCase().includes(F.q.toLowerCase()))return false;
    return true;
  });
  $("feedcount").textContent=rows.length+" of "+feed.length+" recent events (newest first)";
  if(!rows.length)root.appendChild(el("div","No activity yet. New sign-ups and releases appear here.","note"));
  rows.forEach(l=>{
    const s=IDX[l.slot];
    const row=el("div",null,"row");
    const what=el("div",null,"what");
    const name=l.name||"Someone";
    if(l.action==="claim")what.append(el("b",name)," signed up");
    else if(l.action==="book")what.append("Admin booked ",el("b",name));
    else if(l.action==="rename")what.append("Admin renamed ",el("b",name));
    else what.append(el("b",name),"'s slot was released");
    if(l.action==="release")what.appendChild(el("span",l.actor==="admin"?"by admin":"by volunteer","tag"));
    what.appendChild(el("small",s?s.campus+" · "+s.date+" · "+slotText(s):l.slot));
    row.append(what,el("div",whenText(l.at),"t"));
    root.appendChild(row);
  });
}

function renderAll(){
  $("lockstate").textContent=keyOk?"Unlocked":"Locked: you can view, but not change anything";
  $("unlock").textContent=keyOk?"Re-check":"Unlock";
  $("tabSlots").className=tab==="slots"?"on":"";
  $("tabDash").className=tab==="dash"?"on":"";
  $("tabFeed").className=tab==="feed"?"on":"";
  $("slotsView").hidden=tab!=="slots";
  $("dashView").hidden=tab!=="dash";
  $("feedView").hidden=tab!=="feed";
  $("fs").hidden=tab!=="slots";
  $("fq").hidden=tab==="dash";
  renderSlots();renderFeed();
  if(tab==="dash")renderDash();
}

// ---------- actions ----------
async function release(s,c){
  if(!confirm("Release "+c.name+"'s slot?\n"+s.campus+" · "+s.date+" · "+slotText(s)))return;
  await singleRelease(s.id);
}
async function singleRelease(id){
  const k=$("key").value.trim();
  if(!k){toast("Enter the admin key first");return}
  try{
    const r=await fetch("/api/release",{method:"POST",headers:{"content-type":"application/json","x-token":"admin"},body:JSON.stringify({id,adminKey:k})});
    toast(r.status===200?"Slot released":r.status===403?"Wrong admin key":"Couldn't release");
  }catch(e){toast("Can't reach the server")}
  await loadSlots();refreshFeed();
}
async function book(s){
  const name=(prompt("Name to book into this slot:\n"+s.campus+" · "+s.date+" · "+slotText(s))||"").trim();
  if(!name)return;
  const res=await adm("book",{id:s.id,name});
  if(!res)return;
  toast(res.status===200?"Booked":res.status===409?"Someone just took that slot":"Couldn't book");
  await loadSlots();refreshFeed();
}
async function rename(s,c){
  const name=(prompt("Change the name on this slot:",c.name)||"").trim();
  if(!name||name===c.name)return;
  const res=await adm("rename",{id:s.id,name});
  if(!res)return;
  toast(res.status===200?"Name updated":"Couldn't rename");
  await loadSlots();refreshFeed();
}
async function releaseAll(){
  const ids=SLOTS.filter(s=>(!F.campus||s.campus===F.campus)&&s.date===F.date&&claims[s.id]);
  if(!ids.length){toast("No sign-ups on that date");return}
  if(!confirm("Release all "+ids.length+" sign-up(s) on "+F.date+(F.campus?" at "+F.campus:" across all campuses")+"?\nThis can't be undone."))return;
  const res=await adm("releaseMany",{date:F.date,campus:F.campus});
  if(!res)return;
  toast(res.status===200?"Released "+res.data.released+" slot(s)":"Couldn't release");
  await loadSlots();refreshFeed();
}

function takenRows(){return SLOTS.filter(s=>match(s)&&claims[s.id])}
function summary(){
  const out=[];let last="";
  takenRows().sort((a,b)=>dayNum(a.date)-dayNum(b.date)||GROUPS.findIndex(g=>g.title===a.campus)-GROUPS.findIndex(g=>g.title===b.campus)).forEach(s=>{
    const h=s.campus+" · "+s.date;
    if(h!==last){out.push(h);last=h}
    out.push("  "+slotText(s)+": "+claims[s.id].name);
  });
  return out.join("\n")||"No sign-ups match these filters.";
}
function csvText(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[["Campus","Date","Role","Time","Status","Name"]];
  SLOTS.filter(match).sort((a,b)=>dayNum(a.date)-dayNum(b.date)||GROUPS.findIndex(g=>g.title===a.campus)-GROUPS.findIndex(g=>g.title===b.campus)).forEach(s=>{
    const c=claims[s.id];rows.push([s.campus,s.date,s.role,s.time,c?"Taken":"Open",c?c.name:""]);
  });
  return "﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n");
}
function download(name,text){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}


// ---------- dashboard ----------
const RAMP_LO=[36,49,51],RAMP_HI=[52,211,177];   // empty -> full (teal-green). Change with the CSS colours above.
const rampAt=t=>RAMP_LO.map((a,i)=>Math.round(a+(RAMP_HI[i]-a)*t));
const rgb=c=>"rgb("+c.join(",")+")";
const relLum=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])};
const contrast=(a,b)=>{const x=relLum(a),y=relLum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const INK_LIGHT=[255,255,255],INK_DARK=[4,16,14];   // label colours; the page picks whichever contrasts more on each cell
const inkOn=c=>contrast(c,INK_LIGHT)>=contrast(c,INK_DARK)?rgb(INK_LIGHT):rgb(INK_DARK);
const short=d=>d.replace(/(\d+)(?:st|nd|rd|th)\s+(\w{3})\w*/,"$1 $2");
const cnt=a=>({t:a.filter(s=>claims[s.id]).length,n:a.length});
const pctOf=c=>c.n?Math.round(100*c.t/c.n):0;

const tip=$("tip");
function tipShow(node,lines){
  tip.textContent="";
  lines.forEach((l,i)=>tip.appendChild(el("div",l,i===0?"tv":"ts")));
  tip.hidden=false;
  const r=node.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  const x=Math.max(8,Math.min(r.left+r.width/2-w/2,window.innerWidth-w-8));
  tip.style.left=x+"px";
  tip.style.top=(r.top-h-8>8?r.top-h-8:r.bottom+8)+"px";
}
function tipHide(){tip.hidden=true}
function hover(node,lines){
  node.tabIndex=0;node.setAttribute("aria-label",lines.join(", "));
  node.addEventListener("pointerenter",()=>tipShow(node,lines));
  node.addEventListener("pointerleave",tipHide);
  node.addEventListener("focus",()=>tipShow(node,lines));
  node.addEventListener("blur",tipHide);
}
function card(title){const c=el("div",null,"d-card");if(title)c.appendChild(el("h3",title));return c}
function barRow(name,c,tipLines){
  const row=el("div",null,"d-bar");
  row.appendChild(el("div",name,"n"));
  const t=el("div",null,"t"),f=el("i",null,c.t?"":"zero");f.style.width=pctOf(c)+"%";t.appendChild(f);row.appendChild(t);
  const v=el("div",null,"v");v.append(c.t+"/"+c.n+" ",el("span",pctOf(c)+"%"));row.appendChild(v);
  hover(row,tipLines);return row;
}
function renderDash(){
  const root=$("dash");root.textContent="";
  const ss=SLOTS.filter(s=>(!F.campus||s.campus===F.campus)&&(!F.date||s.date===F.date));
  const all=cnt(ss),open=all.n-all.t;
  const scope=(F.campus||"all campuses")+" · "+(F.date||"all dates");

  const brand=el("div",null,"d-brand");
  const wm=el("b");wm.append("more than ",el("i","cables"));
  brand.append(wm,el("span","shadow sessions · "+scope));
  root.appendChild(brand);

  // groups: one per campus + date
  const groups=[];
  GROUPS.forEach(g=>g.days.forEach(dy=>{
    const a=ss.filter(s=>s.campus===g.title&&s.date===dy.d);
    if(a.length)groups.push({campus:g.title,date:dy.d,c:cnt(a)});
  }));
  const empty=groups.filter(x=>x.c.t===0);
  const best=groups.filter(x=>x.c.t>0).sort((a,b)=>b.c.t/b.c.n-a.c.t/a.c.n||b.c.t-a.c.t)[0];

  // headline + tiles
  const top=el("div",null,"d-top");
  const hero=card("slots taken");
  const big=el("div",null,"d-hero");big.append(String(all.t),el("small","of "+all.n+" · "+pctOf(all)+"%"));
  hero.appendChild(big);
  const m=el("div",null,"d-meter"),mf=el("i");mf.style.width=pctOf(all)+"%";m.appendChild(mf);hero.appendChild(m);
  top.appendChild(hero);
  const tiles=el("div",null,"d-tiles");
  const t1=el("div",null,"d-tile");t1.append(el("div","open slots","l"),el("div",String(open),"v"),el("div","still to fill","s"));
  const t2=el("div",null,"d-tile"+(empty.length?" warn":""));
  t2.append(el("div",(empty.length?"⚠ ":"")+"no sign-ups yet","l"),el("div",String(empty.length),"v"),el("div",empty.length===1?"session":"sessions","s"));
  const t3=el("div",null,"d-tile");
  t3.append(el("div","fullest session","l"),el("div",best?best.campus+" · "+short(best.date):"–","v sm"),el("div",best?best.c.t+" of "+best.c.n+" taken":"nothing taken yet","s"));
  tiles.append(t1,t2,t3);top.appendChild(tiles);root.appendChild(top);

  // one ring per campus: how packed the month is (respects the date filter, always shows every campus)
  const NS="http://www.w3.org/2000/svg";
  const svgEl=(t,at)=>{const n=document.createElementNS(NS,t);for(const k in at)n.setAttribute(k,at[k]);return n};
  const ringCard=card("how packed each campus is"+(F.date?" · "+F.date:""));
  const rings=el("div",null,"d-rings");
  const R=42,C=2*Math.PI*R;
  GROUPS.forEach(g=>{
    const a=SLOTS.filter(s=>s.campus===g.title&&(!F.date||s.date===F.date));if(!a.length)return;
    const c=cnt(a),p=c.n?c.t/c.n:0;
    const b=el("button",null,"d-ring"+(F.campus===g.title?" on":""));b.type="button";
    const sv=svgEl("svg",{viewBox:"0 0 104 104",role:"img","aria-hidden":"true"});
    sv.appendChild(svgEl("circle",{cx:52,cy:52,r:R,fill:"none","stroke-width":11,class:"rt"}));
    if(c.t)sv.appendChild(svgEl("circle",{cx:52,cy:52,r:R,fill:"none","stroke-width":11,"stroke-linecap":"round",class:"rf",
      "stroke-dasharray":(C*Math.min(p,.999)).toFixed(2)+" "+C.toFixed(2),transform:"rotate(-90 52 52)"}));
    const tx=svgEl("text",{x:52,y:52,"text-anchor":"middle","dominant-baseline":"central",class:"rp"});tx.textContent=pctOf(c)+"%";
    sv.appendChild(tx);b.appendChild(sv);
    b.append(el("div",g.title,"rn"),el("div",c.t+" of "+c.n+" taken","rs"),el("div",(c.n-c.t)+" open","rs"));
    hover(b,[g.title+": "+pctOf(c)+"% taken",c.t+" of "+c.n+" slots · "+(c.n-c.t)+" open",F.campus===g.title?"Tap to show all campuses":"Tap to focus the dashboard on this campus"]);
    b.onclick=()=>{tipHide();F.campus=F.campus===g.title?"":g.title;fillFilters();renderAll()};
    rings.appendChild(b);
  });
  ringCard.appendChild(rings);root.appendChild(ringCard);

  // scoreboard: who has chosen the most slots (names are matched ignoring case and extra spaces)
  const people=new Map();
  ss.forEach(s=>{
    const c=claims[s.id];if(!c||!c.name)return;
    const nm=String(c.name).trim().replace(/\s+/g," ");if(!nm)return;
    const k=nm.toLowerCase();let e=people.get(k);if(!e){e={forms:new Map(),slots:[]};people.set(k,e)}
    e.forms.set(nm,(e.forms.get(nm)||0)+1);e.slots.push(s);
  });
  const board=[...people.values()].map(e=>({name:[...e.forms].sort((x,y)=>y[1]-x[1])[0][0],n:e.slots.length,slots:e.slots}));
  board.sort((x,y)=>y.n-x.n||x.name.localeCompare(y.name));
  let rk=0,pv=-1;board.forEach((r,i)=>{if(r.n!==pv){rk=i+1;pv=r.n}r.rank=rk});
  const total=board.reduce((m,r)=>m+r.n,0);
  const sc=card("scoreboard · most slots chosen");
  if(!board.length){sc.appendChild(el("div","Nobody has signed up yet. The scoreboard fills in as people book.","d-note"))}
  else{
    sc.appendChild(el("div",board.length+(board.length===1?" person":" people")+" · "+total+" slots chosen"+(F.campus||F.date?" · "+scope:""),"d-note")).style.marginBottom="10px";
    const mx=board[0].n,list=el("div",null,"d-score"),shown=sbAll?board:board.slice(0,8);
    shown.forEach(r=>{
      const row=el("div",null,"d-srow"+(r.rank<=3?" top":""));
      row.appendChild(el("div",String(r.rank),"d-rank"));
      row.appendChild(el("div",r.name,"d-sname"));
      const bar=el("div",null,"d-sbar"),bi=el("i");bi.style.width=Math.round(100*r.n/mx)+"%";bar.appendChild(bi);row.appendChild(bar);
      const num=el("div",String(r.n),"d-snum");num.appendChild(el("small",r.n===1?"slot":"slots"));row.appendChild(num);
      const lines=[r.name+" · "+r.n+(r.n===1?" slot":" slots")];
      const sl=r.slots.slice().sort((x,y)=>dayNum(x.date)-dayNum(y.date)||GROUPS.findIndex(g=>g.title===x.campus)-GROUPS.findIndex(g=>g.title===y.campus));
      sl.slice(0,5).forEach(x=>lines.push(x.campus+" · "+short(x.date)+" · "+slotText(x)));
      if(sl.length>5)lines.push("+ "+(sl.length-5)+" more");
      hover(row,lines);list.appendChild(row);
    });
    sc.appendChild(list);
    if(board.length>8){
      const more=el("button",sbAll?"show top 8":"show all "+board.length);more.type="button";more.className="d-more";
      more.onclick=()=>{sbAll=!sbAll;renderAll()};sc.appendChild(more);
    }
  }
  root.appendChild(sc);

  // campus x date heatmap
  const heatCard=card("campus × date");
  const dates=[...new Set(ss.map(s=>s.date))].sort((a,b)=>dayNum(a)-dayNum(b));
  const camps=GROUPS.filter(g=>ss.some(s=>s.campus===g.title));
  const heat=el("div",null,"d-heat");
  heat.style.gridTemplateColumns="minmax(64px,auto) repeat("+dates.length+",minmax(0,1fr))";
  heat.appendChild(el("div"));
  dates.forEach(d=>heat.appendChild(el("div",short(d),"h")));
  camps.forEach(g=>{
    heat.appendChild(el("div",g.title,"r"));
    dates.forEach(d=>{
      const a=ss.filter(s=>s.campus===g.title&&s.date===d);
      if(!a.length){const x=el("div","·","d-cell none");heat.appendChild(x);return}
      const c=cnt(a),col=rampAt(c.n?c.t/c.n:0);
      const b=el("button",c.t+"/"+c.n,"d-cell");b.type="button";
      b.style.background=rgb(col);b.style.color=inkOn(col);
      hover(b,[c.t+" of "+c.n+" taken",g.title+" · "+d]);
      b.onclick=()=>{tipHide();F.campus=g.title;F.date=d;fillFilters();tab="slots";renderAll()};
      heat.appendChild(b);
    });
  });
  if(camps.length&&dates.length)heatCard.appendChild(heat);else heatCard.appendChild(el("div","Nothing to show for this filter.","d-note"));
  const lg=el("div",null,"d-legend"),bar=el("i");
  bar.style.background="linear-gradient(90deg,"+rgb(rampAt(0))+","+rgb(rampAt(1))+")";
  lg.append("none taken",bar,"all taken");heatCard.appendChild(lg);
  heatCard.appendChild(el("div","Tap a cell to open that session in the slot list.","d-note")).style.marginTop="6px";
  root.appendChild(heatCard);

  // roles: most open slots first
  const roleMap=new Map();
  ss.forEach(s=>{if(!roleMap.has(s.role))roleMap.set(s.role,[]);roleMap.get(s.role).push(s)});
  const roles=[...roleMap].map(([r,a])=>({r,c:cnt(a)})).sort((a,b)=>(b.c.n-b.c.t)-(a.c.n-a.c.t)||a.r.localeCompare(b.r));
  const roleCard=card("where we need people (most open slots first)");
  const rb=el("div",null,"d-bars");
  roles.forEach(x=>rb.appendChild(barRow(x.r,x.c,[x.c.t+" of "+x.c.n+" taken",x.r+" · "+(x.c.n-x.c.t)+" open"])));
  roleCard.appendChild(rb);root.appendChild(roleCard);

  // sign-ups by day (needs the admin key: the data comes from the activity log)
  const dayCard=card("sign-ups by day");
  if(!keyOk){
    dayCard.appendChild(el("div","Unlock with the admin key to see how sign-ups build up over time.","d-note"));
  }else{
    const ok=l=>{const s=IDX[l.slot];if(!F.campus&&!F.date)return true;if(!s)return false;return(!F.campus||s.campus===F.campus)&&(!F.date||s.date===F.date)};
    const ev=feed.filter(l=>(l.action==="claim"||l.action==="book"||l.action==="release")&&ok(l));
    const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const ups=new Map(),rel=new Map();
    ev.forEach(l=>{const k=dk(new Date(l.at));const m2=l.action==="release"?rel:ups;m2.set(k,(m2.get(k)||0)+1)});
    if(!ups.size){dayCard.appendChild(el("div","No sign-ups recorded yet. They appear here as people book.","d-note"))}
    else{
      const first=new Date([...ups.keys()].sort()[0]+"T00:00:00"),today=new Date();today.setHours(0,0,0,0);
      let start=first;const cap=new Date(today);cap.setDate(cap.getDate()-13);if(start<cap)start=cap;
      const days=[];for(let d=new Date(start);d<=today;d.setDate(d.getDate()+1))days.push(new Date(d));
      const vals=days.map(d=>ups.get(dk(d))||0),max=Math.max(1,...vals),top=vals.indexOf(Math.max(...vals));
      const cols=el("div",null,"d-cols");
      days.forEach((d,i)=>{
        const col=el("div",null,"d-col"),b=el("div",null,"b"+(vals[i]?"":" z"));
        b.style.height=Math.round(100*vals[i]/max)*0.78+"%";
        if(i===top&&vals[i])col.appendChild(el("span",String(vals[i]),"top"));
        col.append(b,el("span",String(d.getDate()),"x"));
        const r=rel.get(dk(d))||0;
        hover(col,[vals[i]+(vals[i]===1?" sign-up":" sign-ups"),d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+(r?" · "+r+" released":"")]);
        cols.appendChild(col);
      });
      dayCard.appendChild(cols);
      dayCard.appendChild(el("div","From the latest "+feed.length+" recorded events. Last "+days.length+" days.","d-note")).style.marginTop="8px";
    }
  }
  root.appendChild(dayCard);

  // table view: every number above, without hovering
  const tv=el("details",null,"d-card d-table");
  tv.appendChild(el("summary","view as a table"));
  const tb=el("table"),th=el("thead"),hr=el("tr");
  ["Campus","Date","Taken","Open","Total"].forEach((h,i)=>hr.appendChild(el("th",h,i>1?"num":"")));
  th.appendChild(hr);tb.appendChild(th);
  const body=el("tbody");
  groups.sort((a,b)=>dayNum(a.date)-dayNum(b.date)||GROUPS.findIndex(g=>g.title===a.campus)-GROUPS.findIndex(g=>g.title===b.campus)).forEach(x=>{
    const r=el("tr");
    r.append(el("td",x.campus),el("td",x.date),el("td",String(x.c.t),"num"),el("td",String(x.c.n-x.c.t),"num"),el("td",String(x.c.n),"num"));
    body.appendChild(r);
  });
  tb.appendChild(body);tv.appendChild(tb);root.appendChild(tv);

  root.appendChild(el("div","designed intentionally · @morethancables","d-foot"));
}

// ---------- wiring ----------
$("fc").onchange=e=>{F.campus=e.target.value;fillDates();renderAll()};
$("fd").onchange=e=>{F.date=e.target.value;renderAll()};
$("fs").onchange=e=>{F.status=e.target.value;renderAll()};
$("fq").oninput=e=>{F.q=e.target.value.trim();renderAll()};
$("tabSlots").onclick=()=>{tab="slots";renderAll()};
$("tabDash").onclick=()=>{tab="dash";renderAll();refreshFeed()};
$("tabFeed").onclick=()=>{tab="feed";renderAll();refreshFeed()};
$("unlock").onclick=()=>unlock(false);
$("key").addEventListener("keydown",e=>{if(e.key==="Enter")unlock(false)});
$("reload").onclick=()=>{loadSlots();refreshFeed()};
$("relall").onclick=releaseAll;
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(summary());toast("Copied")}catch(e){toast("Couldn't copy")}};
$("csv").onclick=()=>{try{download("shadow-signups.csv",csvText());toast("CSV downloaded")}catch(e){toast("Couldn't export")}};

fillFilters();
try{const k=sessionStorage.getItem("adminkey");if(k){$("key").value=k;unlock(true)}}catch(e){}
loadSlots();
setInterval(()=>{if(!document.hidden){loadSlots();refreshFeed()}},15000);
</script>
