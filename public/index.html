<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Production KL Team Shadow Sessions</title>
<meta name="description" content="Select your campus and time slot for a Production KL Team shadow session.">
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f2;--card:#fff;--ink:#161616;--mute:#6b6a66;--line:#e3e1db;--acc:#161616;--accbg:#f1ece0;--taken:#eeedea;--ok:#2f7a54;--okbg:#e3f1ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0b;--card:#141416;--ink:#ececea;--mute:#9b9a9f;--line:#27272b;--acc:#d6c696;--accbg:#1d1c18;--taken:#1c1c1f;--ok:#6fd3a0;--okbg:#11271c}}
:root[data-theme="dark"]{--bg:#0a0a0b;--card:#141416;--ink:#ececea;--mute:#9b9a9f;--line:#27272b;--acc:#d6c696;--accbg:#1d1c18;--taken:#1c1c1f;--ok:#6fd3a0;--okbg:#11271c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px}
.name{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:20px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.name label{width:100%;font-size:.85rem;color:var(--mute)}
.name input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.pick label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}
.pick select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
h2{font-size:1.1rem;margin:20px 0 8px}
.role{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.role b{display:block;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.slot{font:inherit;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--acc);background:var(--accbg);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.slot small{color:var(--mute)}
.slot.taken{border-color:var(--line);background:var(--taken);cursor:not-allowed;color:var(--mute)}
.slot.mine{border-color:var(--ok);background:var(--okbg);cursor:pointer;color:var(--ink)}
.slot:disabled:not(.taken){opacity:.6;cursor:not-allowed}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#msg.on{opacity:1}
#note{background:var(--taken);border-radius:10px;padding:10px 12px;color:var(--mute);margin-bottom:16px;display:none}

/* ---- shadcn-style refinement: Inter, soft glow, ring focus, gentle motion (look only, no behaviour) ---- */
:root{--r:.5rem;--ring:color-mix(in srgb,var(--ink) 55%,transparent);--glow:rgba(122,92,30,.09);--ease:cubic-bezier(.16,1,.3,1)}
@media (prefers-color-scheme:dark){:root{--glow:rgba(214,198,150,.10)}}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-feature-settings:"cv11","ss01";letter-spacing:-.006em}
h1{font-weight:700;letter-spacing:-.03em}
h2{font-weight:600;letter-spacing:-.015em}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes zoomIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
main{animation:fadeUp .55s var(--ease) both}
:where(button){font-weight:500;transition:background-color .15s,color .15s,border-color .15s,box-shadow .15s,transform .12s var(--ease),opacity .15s}
:where(button:hover:not(:disabled)){opacity:.9}
:where(button:active:not(:disabled)){transform:scale(.97)}
:where(button,input,select,textarea):focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ring)}
:where(input,select,textarea){transition:border-color .15s,box-shadow .15s}
#msg{transition:opacity .2s,transform .3s var(--ease)}

.slot{transition:transform .18s var(--ease),box-shadow .18s,border-color .15s,background-color .15s}
.slot:not(.taken):not(:disabled):hover{transform:translateY(-2px);box-shadow:0 6px 16px -8px rgba(0,0,0,.35)}
.slot:not(.taken):not(:disabled):active{transform:scale(.98)}
.role,.name{border-radius:.9rem;box-shadow:0 1px 2px rgba(0,0,0,.06)}
#list{animation:fadeUp .5s var(--ease) both}
#msg{transform:translate(-50%,8px)}#msg.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ---- aurora background (adapted from the reference: drifting blurred light bands, masked toward the top right) ---- */
:root{--au-base:#fafaf8;--au-op:.26;--au-blend:difference;--au-c1:#d9c79a;--au-c2:#b9a06a;--au-c3:#a8a396;--au-c4:#ece3cc;--au-c5:#c4a266}
@media (prefers-color-scheme:dark){:root{--au-base:#000;--au-op:.5;--au-c1:#d6c696;--au-c2:#8f7a45;--au-c3:#6b665c;--au-c4:#e6dfcb;--au-c5:#a98a4f}}
body{background-image:none}
@keyframes aurora{from{background-position:50% 50%,50% 50%}to{background-position:350% 50%,350% 50%}}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{
  --mask:repeating-linear-gradient(100deg,var(--au-base) 0%,var(--au-base) 7%,transparent 10%,transparent 12%,var(--au-base) 16%);
  --lights:repeating-linear-gradient(100deg,var(--au-c1) 10%,var(--au-c2) 15%,var(--au-c3) 20%,var(--au-c4) 25%,var(--au-c5) 30%);
  position:absolute;inset:-10px;display:block;opacity:var(--au-op);will-change:transform;
  background-image:var(--mask),var(--lights);background-size:300%,200%;background-position:50% 50%,50% 50%;
  filter:blur(10px);
  -webkit-mask-image:radial-gradient(ellipse at 100% 0%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 100% 0%,#000 10%,transparent 70%)}
.aurora i:after{content:"";position:absolute;inset:0;background-image:var(--mask),var(--lights);background-size:200%,100%;background-attachment:fixed;mix-blend-mode:var(--au-blend);animation:aurora 60s linear infinite}
@media (max-width:640px){.aurora i{filter:blur(6px)}}
@media (prefers-reduced-motion:reduce){.aurora i:after{animation:none!important}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i></div>
<main>
  <h1>Production KL Team Shadow Sessions</h1>
  <p class="sub">Please select your campus and your time slot. Please note that sessions are available on a first come first served basis</p>
  <div id="note"></div>
  <div class="name">
    <label for="nm">Your name</label>
    <input id="nm" type="text" maxlength="40" placeholder="Enter your name to sign up" autocomplete="name">
    <div class="pick">
      <label>Campus<select id="cp"></select></label>
      <label>Date<select id="dt"></select></label>
    </div>
  </div>
  <div id="list"></div>
</main>
<div id="msg" role="status"></div>
<script>
// Sessions come from the server (managed on the admin page). Past dates are hidden.
let SLOTS=[],GROUPS=[],ver="";
const sid=(d,g,r,t)=>[d.replace(/\s*\(.*\)\s*$/,""),g,r,t].join("-").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/-$/,"");
const $=id=>document.getElementById(id);
const nm=$("nm"),dt=$("dt"),cp=$("cp");
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function buildGroups(){
  const t=todayStr(),gs=[];
  SLOTS.filter(s=>s.day>=t).forEach(s=>{
    let g=gs.find(x=>x.title===s.campus);if(!g)gs.push(g={title:s.campus,days:[]});
    let d=g.days.find(x=>x.d===s.date);if(!d)g.days.push(d={d:s.date,day:s.day,roles:[]});
    let r=d.roles.find(x=>x.n===s.role);if(!r)d.roles.push(r={n:s.role,t:[]});
    r.t.push({t:s.time,id:s.id});
  });
  gs.forEach(g=>g.days.sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:0));
  GROUPS=gs;
}
function fillCampus(){
  const prev=cp.value||saved("shadow-campus");cp.textContent="";
  GROUPS.forEach(g=>cp.add(new Option(g.title,g.title)));
  if(GROUPS.some(g=>g.title===prev))cp.value=prev;
  fillDate();
}
function fillDate(){const prev=dt.value||saved("shadow-date");dt.textContent="";const g=GROUPS.find(x=>x.title===cp.value);(g?g.days:[]).forEach(x=>dt.add(new Option(x.d,x.d)));if([...dt.options].some(o=>o.value===prev))dt.value=prev}
function saved(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
function saveSel(){try{localStorage.setItem("shadow-date",dt.value);localStorage.setItem("shadow-campus",cp.value)}catch(e){}}
cp.addEventListener("change",()=>{dt.value="";fillDate();saveSel();render()});
dt.addEventListener("change",()=>{saveSel();render()});
let claims={},busy=false,loaded=false,offline=false;

// Anonymous per-browser token: lets a volunteer release their own slot.
let token;
try{token=localStorage.getItem("shadow-token");if(!token){token=crypto.randomUUID();localStorage.setItem("shadow-token",token)}}
catch(e){token=token||(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)+"0000000000")}
try{nm.value=localStorage.getItem("shadow-name")||""}catch(e){}
nm.addEventListener("input",()=>{try{localStorage.setItem("shadow-name",nm.value)}catch(e){}});

function toast(t){const m=$("msg");m.textContent=t;m.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>m.classList.remove("on"),2600)}
function note(t){const n=$("note");n.textContent=t;n.style.display=t?"block":"none"}

async function api(path,opts={}){
  const r=await fetch("/api/"+path,{...opts,headers:{"content-type":"application/json","x-token":token}});
  let d={};try{d=await r.json()}catch(e){}
  return {status:r.status,data:d};
}

function render(){
  const root=$("list");root.textContent="";
  if(loaded&&!GROUPS.length){const e=document.createElement("div");e.className="role";e.textContent="No upcoming sessions are open right now. Please check back soon.";root.appendChild(e);return}
  GROUPS.filter(g=>g.title===cp.value).forEach(g=>{const day=g.days.find(x=>x.d===dt.value);if(!day)return;
    const h=document.createElement("h2");h.textContent=g.title+" · "+dt.value;root.appendChild(h);
    day.roles.forEach(r=>{
      const card=document.createElement("div");card.className="role";
      const b=document.createElement("b");b.textContent=r.n;card.appendChild(b);
      const o=document.createElement("div");o.className="opts";
      r.t.forEach(({t,id})=>{
        const c=claims[id];
        const btn=document.createElement("button");btn.className="slot";btn.type="button";
        const top=document.createElement("span");top.textContent=t||"Available";
        const sub=document.createElement("small");
        if(c){
          btn.classList.add(c.mine?"mine":"taken");
          sub.textContent=c.mine?"Yours · tap to release":"Taken by "+(c.name||"someone");
          if(c.mine)btn.onclick=()=>release(id);else btn.disabled=true;
        }else{
          sub.textContent=loaded?"Open · tap to claim":"Loading…";
          btn.disabled=!loaded;
          btn.onclick=()=>claim(id);
        }
        btn.append(top,sub);o.appendChild(btn);
      });
      card.appendChild(o);root.appendChild(card);
    });
  });
}

async function refresh(){
  try{
    const {status,data}=await api("slots"+(ver?"?v="+encodeURIComponent(ver):""));
    if(status!==200)throw 0;
    claims=data.claims||{};loaded=true;
    if(data.slots){SLOTS=data.slots;ver=data.v}
    buildGroups();
    if(data.slots||!cp.options.length)fillCampus();
    if(offline){offline=false;note("")}
  }catch(e){offline=true;note("Can't reach the server. Retrying…")}
  render();
}

async function claim(id){
  const name=nm.value.trim();
  if(!name){toast("Enter your name first");nm.focus();return}
  if(busy)return;busy=true;
  try{
    const {status}=await api("claim",{method:"POST",body:JSON.stringify({id,name})});
    if(status===200)toast("You're signed up!");
    else if(status===409)toast("Sorry, that slot was just taken.");
    else toast("Couldn't sign up. Please try again.");
  }catch(e){toast("Couldn't sign up. Check your connection.")}
  finally{busy=false;refresh()}
}
async function release(id){
  if(busy||!confirm("Release this slot so someone else can take it?"))return;busy=true;
  try{
    const {status}=await api("release",{method:"POST",body:JSON.stringify({id})});
    toast(status===200?"Slot released":"Couldn't release the slot.");
  }catch(e){toast("Couldn't release. Check your connection.")}
  finally{busy=false;refresh()}
}

render();refresh();
setInterval(()=>{if(!document.hidden)refresh()},15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
</script>
</body>
</html>
